# Headway: headway.shivrajsinh.in, a static Astro build (build.format 'file': /au/brisbane/route-272
# is au/brisbane/route-272.html) served from /var/www/headway/current, a symlink that deploy.sh
# swaps in one step. Cloudflare sits in front (proxied, Full strict); the wildcard Cloudflare origin
# certificate already on this server covers *.shivrajsinh.in.
#
# Install: deploy/README.md

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name headway.shivrajsinh.in;

  ssl_certificate     /etc/ssl/stopwatch.pem;
  ssl_certificate_key /etc/ssl/stopwatch.key;

  root /var/www/headway/current;
  index index.html;
  charset utf-8;
  # Behind Cloudflare the origin sees http; relative redirects keep visitors on https.
  absolute_redirect off;

  # deploy.sh ships a .gz next to every text file; served as stored, unpacked for clients without gzip.
  gzip_static on;
  gunzip on;
  gzip on;
  gzip_types application/json application/xml text/plain image/svg+xml;

  access_log /var/log/nginx/headway.access.log combined buffer=64k flush=5m;
  include /etc/nginx/snippets/stopwatch-security.conf;

  error_page 404 /404.html;
  location = /404.html { internal; }

  # One URL per page: /x.html and /x/ go to /x. Duplicate addresses split a page's signals.
  location = /index.html { return 301 /$is_args$args; }
  location ~ ^(?<page>/.+)\.html$ { return 301 $page$is_args$args; }
  location ~ ^(?<page>/.+)/$ { return 301 $page$is_args$args; }

  # Hashed build output never changes under the same name.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }

  # Every stop's times, fetched when a rider changes stop. Changes with each data sync.
  location ^~ /data/ {
    add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }
  location = /search.json {
    add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }
  # Crawlers should see a new sitemap soon after a release.
  location ~ ^/(sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }
  location ~ ^/(og\.png|favicon\.svg|apple-touch-icon\.png)$ {
    add_header Cache-Control "public, max-age=604800" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }

  # Pages: browsers re-check each visit; Cloudflare keeps a copy for a day and serves the old one
  # while it re-fetches. No $uri/ here: /au/brisbane is both a page and a folder, and must be the page.
  location / {
    try_files $uri $uri.html =404;
    add_header Cache-Control "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }
  location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800" always;
    include /etc/nginx/snippets/stopwatch-security.conf;
  }
}
